<h2>实施计划</h2>

<div class="section">
  <h3>顺序：D1 → B1 → B2 (由易到难)</h3>

  <div class="cards">
    <div class="card" data-choice="d1" onclick="toggleSelect(this)">
      <div class="card-body">
        <h3>1. D1 AI 球评 (1h)</h3>
        <p>模板引擎，5 段段落自动拼接。放在比赛详情页底部</p>
        <p style="color:#4ade80;font-size:11px">最简单 · 今天上线</p>
      </div>
    </div>
    <div class="card" data-choice="b1" onclick="toggleSelect(this)">
      <div class="card-body">
        <h3>2. B1 模拟引擎 (2h)</h3>
        <p>蒙特卡洛 1000 次模拟 + 频次直方图。放在比赛详情页</p>
        <p style="color:#f0c040;font-size:11px">中等难度</p>
      </div>
    </div>
    <div class="card" data-choice="b2" onclick="toggleSelect(this)">
      <div class="card-body">
        <h3>3. B2 淘汰赛晋级树 (4h)</h3>
        <p>新页面 /bracket，完整晋级路径 + 冠军概率</p>
        <p style="color:#ef4444;font-size:11px">最复杂</p>
      </div>
    </div>
  </div>
</div>
